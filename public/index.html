<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAI Dashboard — Santosh AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#020617;color:#fff;
       min-height:100vh;padding:clamp(20px,4vw,40px)}
  header{display:flex;align-items:center;gap:16px;margin-bottom:26px}
  .logo{width:48px;height:48px;background:linear-gradient(135deg,#020617,#172554);
        border-radius:12px;display:flex;align-items:center;justify-content:center;
        font-weight:900;position:relative;letter-spacing:-1px;
        box-shadow:0 0 0 1px #1E293B,0 0 30px rgba(239,68,68,.3)}
  .logo::before,.logo::after{content:'';position:absolute;width:6px;height:6px;
        background:#EF4444;border-radius:50%;box-shadow:0 0 10px #EF4444}
  .logo::before{top:9px;left:9px}
  .logo::after{top:9px;right:9px}
  h1{font-size:28px;font-weight:900;letter-spacing:-1px}
  h1 span{color:#EF4444}
  .sub{color:#64748B;font-size:12px;letter-spacing:3px;margin-top:2px}

  .status{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;
        border-radius:20px;font-size:12px;font-weight:600;margin-bottom:26px;
        background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#10B981}
  .status.stale{background:rgba(234,179,8,.1);border-color:rgba(234,179,8,.35);color:#EAB308}
  .status.down{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35);color:#EF4444}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
  .card{background:linear-gradient(135deg,#0B1120,#0F172A);border:1px solid #1E293B;
        border-radius:16px;padding:24px;transition:border-color .2s,transform .2s}
  .card:hover{border-color:#EF4444;transform:translateY(-2px)}
  .card h3{font-size:12px;color:#94A3B8;text-transform:uppercase;letter-spacing:2px;
        margin-bottom:12px;font-weight:600}
  .value{font-size:clamp(26px,4vw,36px);font-weight:900;line-height:1.1;
        background:linear-gradient(135deg,#EF4444,#FB7185);
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .meta{color:#475569;font-size:12px;margin-top:6px}

  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
        gap:20px;margin-top:20px}
  .panel{background:#0B1120;border:1px solid #1E293B;border-radius:16px;padding:22px}
  .panel h3{font-size:12px;color:#94A3B8;text-transform:uppercase;letter-spacing:2px;
        margin-bottom:14px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:7px 0;border-bottom:1px solid #131c2e;color:#CBD5E1}
  td.n{text-align:right;color:#94A3B8;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:4px}
  .bar{flex:1;min-width:3px;border-radius:3px 3px 0 0;
        background:linear-gradient(180deg,#EF4444,#7f1d1d)}
  .bar:hover{background:linear-gradient(180deg,#FB7185,#EF4444)}
  .axis{display:flex;justify-content:space-between;color:#475569;font-size:11px;margin-top:8px}
  .note{color:#475569;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<header>
  <div class="logo">SAI</div>
  <div>
    <h1>SAI <span>Dashboard</span></h1>
    <div class="sub">SANTOSH AI · SALES</div>
  </div>
</header>

<div class="status down" id="status"><span class="dot"></span><span id="status-text">Loading…</span></div>

<div class="grid">
  <div class="card"><h3>Sales Value</h3><div class="value" id="amount">—</div>
       <div class="meta" id="period">—</div></div>
  <div class="card"><h3>Quantity</h3><div class="value" id="qty">—</div>
       <div class="meta">units billed</div></div>
  <div class="card"><h3>Line Items</h3><div class="value" id="lines">—</div>
       <div class="meta">invoice lines</div></div>
  <div class="card"><h3>Customers</h3><div class="value" id="customers">—</div>
       <div class="meta">billed in period</div></div>
</div>

<div class="panels">
  <div class="panel"><h3>Daily Trend</h3>
    <div class="bars" id="bars"></div>
    <div class="axis"><span id="axis-from">—</span><span id="axis-to">—</span></div></div>
  <div class="panel"><h3>Top Customers</h3><table id="top-customers"></table></div>
  <div class="panel"><h3>Top Materials</h3><table id="top-materials"></table></div>
  <div class="panel"><h3>By Plant</h3><table id="top-plants"></table></div>
</div>

<div class="note" id="note"></div>

<script>
// The snapshot is pushed here by Santosh AI and polled by this page.
// A WebSocket to localhost cannot work on a hosted site: every visitor's
// browser would dial its own machine, and the laptop holding the SAP
// connection is behind a firewall that allows outbound calls only.
const SOURCE = '/receive?name=sales';
const POLL_MS = 5000;      // the agent publishes every 30 min
const STALE_MINUTES = 45;   // older than this and the agent has stopped

const nf = new Intl.NumberFormat('en-IN');

function money(value) {
  const n = Number(value) || 0;
  if (Math.abs(n) >= 1e7) return (n / 1e7).toFixed(2) + ' Cr';
  if (Math.abs(n) >= 1e5) return (n / 1e5).toFixed(2) + ' L';
  return nf.format(Math.round(n));
}

function setStatus(kind, text) {
  const el = document.getElementById('status');
  el.className = 'status ' + kind;
  document.getElementById('status-text').textContent = text;
}

function fillTable(id, rows) {
  const table = document.getElementById(id);
  table.innerHTML = '';
  (rows || []).forEach(row => {
    const tr = table.insertRow();
    tr.insertCell().textContent = row.name;
    const cell = tr.insertCell();
    cell.className = 'n';
    cell.textContent = money(row.amount);
  });
  if (!table.rows.length) {
    const cell = table.insertRow().insertCell();
    cell.textContent = 'No data';
    cell.style.color = '#475569';
  }
}

function drawBars(daily) {
  const holder = document.getElementById('bars');
  holder.innerHTML = '';
  const points = daily || [];
  const peak = Math.max(1, ...points.map(p => Math.abs(p.amount)));
  points.forEach(point => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = Math.max(2, (Math.abs(point.amount) / peak) * 100) + '%';
    bar.title = point.date + ' — ' + money(point.amount);
    holder.appendChild(bar);
  });
  document.getElementById('axis-from').textContent = points.length ? points[0].date : '—';
  document.getElementById('axis-to').textContent =
    points.length ? points[points.length - 1].date : '—';
}

function render(data) {
  const kpis = data.kpis || {};
  document.getElementById('amount').textContent = money(kpis.sales_amount);
  document.getElementById('qty').textContent = nf.format(Math.round(kpis.sales_quantity || 0));
  document.getElementById('lines').textContent = nf.format(kpis.line_items || 0);
  document.getElementById('customers').textContent = nf.format(kpis.customers || 0);
  document.getElementById('period').textContent =
    (data.period || '') + (data.latest_date ? ' · to ' + data.latest_date : '');

  drawBars((data.series || {}).daily);
  const top = data.top || {};
  fillTable('top-customers', top.customers);
  fillTable('top-materials', top.materials);
  fillTable('top-plants', top.plants);
  document.getElementById('note').textContent = data.note || '';

  // Say plainly when the numbers stopped moving. A dashboard showing
  // yesterday's figures as though they were live is worse than one
  // that admits it is stale.
  const stamp = new Date(data.generated_at || data.received_at || Date.now());
  const ageMinutes = (Date.now() - stamp.getTime()) / 60000;
  const shown = stamp.toLocaleString();
  if (ageMinutes > STALE_MINUTES) {
    setStatus('stale', 'Stale — last update ' + shown +
              ' (' + Math.round(ageMinutes) + " min ago)");
  } else {
    setStatus('', 'Live · updated ' + shown);
  }
}

async function poll() {
  try {
    const response = await fetch(SOURCE + '&t=' + Date.now(), {cache: 'no-store'});
    if (response.status === 404) {
      setStatus('stale', 'Waiting for the first snapshot from Santosh AI');
      return;
    }
    if (!response.ok) throw new Error('HTTP ' + response.status);
    render(await response.json());
  } catch (error) {
    setStatus('down', 'Cannot reach the snapshot: ' + error.message);
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
